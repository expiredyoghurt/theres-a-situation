<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Boss! There's a situation!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Lexend:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241a12;
    --paper:#EFE3C0;
    --paper-dark:#DCCB9C;
    --paper-shadow:#c9b479;
    --navy:#1B2A38;
    --navy-light:#28405A;
    --red:#B23A2E;
    --red-dark:#8C2C22;
    --green:#3E6B2E;
    --green-light:#DCE9C8;
    --gold:#C99A2E;
    --card:#FBF6E6;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  /* Visible keyboard-focus ring on every interactive element (buttons,
     links, and the div/span "cards" below that act as buttons via
     role="button"). Mouse clicks don't show this — only real keyboard
     focus does — so it never adds visual noise for mouse/touch users. */
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  [role="button"]{cursor:pointer;}
  body{
    background:
      radial-gradient(ellipse at top left, #2c2115 0%, transparent 60%),
      var(--navy);
    background-color:var(--navy);
    color:var(--ink);
    font-family:'Lexend', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.headline{
    font-family:'Special Elite', monospace;
    letter-spacing:.3px;
    font-weight:400;
  }
  .wrap{max-width:920px;margin:0 auto;padding:18px 16px 60px;}
  a{color:inherit;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;color:var(--paper);
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:'Special Elite',monospace;font-size:20px;}
  .brand .badge{
    width:34px;height:34px;border-radius:50%;background:var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:18px;
    box-shadow:0 0 0 3px #7a5c1f inset;
  }
  .topbar-actions button{
    background:none;border:1px solid #6a7c93;color:var(--paper);
    font-family:'Lexend';font-size:13px;padding:7px 12px;border-radius:20px;cursor:pointer;
  }
  .topbar-actions button:hover{background:#28405A;}

  /* ---------- case file "paper" panel ---------- */
  .panel{
    background:var(--paper);
    border-radius:var(--radius);
    box-shadow:0 14px 34px rgba(0,0,0,.35);
    position:relative;
    padding:26px 26px 30px;
    border:1px solid var(--paper-shadow);
  }
  .panel::before{
    content:"";position:absolute;inset:8px;border:1.5px dashed #b79f5f;border-radius:6px;pointer-events:none;opacity:.5;
  }
  .stamp{
    position:absolute;top:18px;right:22px;
    border:3px solid var(--red);color:var(--red);
    font-family:'Special Elite',monospace;font-size:13px;
    padding:5px 10px;border-radius:6px;transform:rotate(8deg);
    opacity:.85;
  }

  .stamp.stamp-case{position:static;display:inline-block;transform:rotate(-1.5deg);margin:0 0 10px;font-size:12px;max-width:100%;}

  /* ---------- home ---------- */
  .agency-title{font-size:30px;text-align:center;color:var(--navy);margin:6px 0 2px;}
  .agency-sub{text-align:center;color:#5b4321;margin:0 0 22px;font-size:14px;}
  .name-row{display:flex;gap:10px;justify-content:center;margin-bottom:26px;flex-wrap:wrap;}
  .name-row input{
    font-family:'Lexend';font-size:15px;padding:10px 14px;border-radius:8px;
    border:1.5px solid var(--paper-shadow);background:var(--card);min-width:240px;
  }
  .case-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .due-panel{background:#fbeecb;border:1.5px dashed #c99a2e;border-radius:8px;padding:14px 16px;margin-bottom:20px;}
  .due-title{font-family:'Special Elite',monospace;font-size:15px;color:#7a4e12;}
  .due-list{display:flex;flex-direction:column;gap:6px;}
  .due-item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--card);border:1.5px solid var(--paper-shadow);border-radius:6px;
    padding:8px 12px;cursor:pointer;font-size:13.5px;
  }
  .due-item:hover{background:#fff;}
  .due-score{color:#9a3b2e;font-size:12px;font-weight:600;white-space:nowrap;}
  .case-card{
    background:var(--card);border:1.5px solid var(--paper-shadow);border-radius:8px;
    overflow:hidden;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;
    display:flex;flex-direction:column;
  }
  .case-card:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.25);}
  .case-card img{width:100%;height:120px;object-fit:cover;border-bottom:1.5px solid var(--paper-shadow);}
  .case-card .body{padding:12px 14px;}
  .case-card .tag{
    display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin-bottom:6px;
    background:var(--navy-light);color:#fff;
  }
  .case-card .tag.informal{background:var(--red-dark);}
  .case-card .tag.article{background:#2f6b3a;}
  .case-card h3{font-size:15px;margin:0 0 4px;color:var(--navy);}

  /* ---------- tabs / progress ---------- */
  .tabs{display:flex;gap:6px;margin:0 0 20px;flex-wrap:wrap;}
  .tab{
    font-family:'Special Elite',monospace;font-size:12.5px;padding:7px 12px;
    background:var(--paper-dark);border-radius:6px 6px 0 0;color:#5b4321;
    border:1px solid var(--paper-shadow);border-bottom:none;opacity:.6;
  }
  .tab.active{background:var(--card);opacity:1;color:var(--navy);}
  .tab.done{opacity:1;}
  .tab.done::after{content:" ✓";color:var(--green);}

  .step-title{color:var(--navy);margin:0 0 4px;font-size:22px;}
  .step-instr{color:#5b4321;font-size:14px;margin:0 0 18px;line-height:1.5;}

  /* ---------- task chunks ---------- */
  .task-text{
    background:var(--card);border:1.5px dashed var(--paper-shadow);border-radius:8px;
    padding:16px;line-height:2.1;font-size:15.5px;margin-bottom:14px;
  }
  .chunk{
    display:inline;cursor:pointer;padding:2px 3px;border-radius:4px;border-bottom:2px solid transparent;
  }
  .chunk:hover{background:#fff2cf;}
  .chunk.tag-purpose{background:#DCE9C8;border-bottom-color:var(--green);}
  .chunk.tag-audience{background:#D9E4F2;border-bottom-color:#2b5c8a;}
  .chunk.tag-context{background:#F2DDD6;border-bottom-color:var(--red);}
  .chunk.tag-other{background:#eee1c5;border-bottom-color:#a1895a;}
  /* Icon badge alongside each tag's color, so the tag type doesn't rely
     on color alone (helps colorblind pupils, and is a second visual cue
     for everyone). aria-hidden since the accessible name is already set
     via aria-label on the chunk itself. */
  .tag-icon{font-size:11px;margin-left:2px;opacity:.85;}
  .chunk-picker{
    display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 18px;
    background:var(--card);padding:12px;border-radius:8px;border:1px solid var(--paper-shadow);
  }
  .chunk-picker button{
    font-family:'Lexend';font-size:13px;padding:6px 12px;border-radius:20px;cursor:pointer;
    border:1.5px solid var(--paper-shadow);background:#fff;
  }
  .chunk-picker button.purpose{border-color:var(--green);}
  .chunk-picker button.audience{border-color:#2b5c8a;}
  .chunk-picker button.context{border-color:var(--red);}

  /* ---------- evidence cards ---------- */
  .evidence-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:10px;}
  .evidence-card{
    background:var(--card);border:1.5px solid var(--paper-shadow);border-radius:8px;padding:14px;
    cursor:pointer;font-size:14px;position:relative;transition:box-shadow .1s;
  }
  .evidence-card::before{content:"📌";position:absolute;top:-10px;left:12px;font-size:16px;opacity:0;}
  .evidence-card.selected{background:var(--green-light);border-color:var(--green);box-shadow:0 3px 8px rgba(0,0,0,.15);}
  .evidence-card.selected::before{opacity:1;}

  /* ---------- own content ---------- */
  textarea{
    width:100%;font-family:'Lexend';font-size:14.5px;padding:12px;border-radius:8px;
    border:1.5px solid var(--paper-shadow);background:var(--card);resize:vertical;min-height:90px;
  }
  .prompt-box{
    background:#fff7de;border:1.5px dashed var(--gold);border-radius:8px;padding:12px 14px;
    font-size:14px;margin-bottom:12px;color:#5b4321;
  }

  /* ---------- letter builder ---------- */
  .component{
    background:var(--card);border:1.5px solid var(--paper-shadow);border-radius:8px;
    padding:14px 16px;margin-bottom:12px;
  }
  .component .label{font-family:'Special Elite',monospace;font-size:13px;color:var(--navy);margin-bottom:8px;}
  .option{
    display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--paper-shadow);
    border-radius:6px;padding:9px 12px;margin-bottom:6px;cursor:pointer;font-size:14px;font-family:'Lexend';
  }
  .option:hover{border-color:var(--gold);}
  .option.picked{background:var(--green-light);border-color:var(--green);font-weight:600;}
  .para-toggle{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:12.5px;color:#5b4321;}
  .para-toggle input{accent-color:var(--red);}
  .signoff-name-field input{
    width:100%;font-family:'Lexend';font-size:14px;padding:9px 12px;border-radius:6px;
    border:1.5px solid var(--paper-shadow);background:#fff;
  }
  .field-note{font-size:12px;color:#7a6a45;margin:6px 0 0;}

  .letter-preview{
    background:#fffdf5;border:2px solid var(--navy);border-radius:8px;padding:18px 20px;
    font-family:'Caveat',cursive;font-size:19px;line-height:1.55;white-space:pre-wrap;min-height:140px;color:#1c2a1a;
  }
  .letter-preview .placeholder{color:#9c9375;font-family:'Lexend';font-size:14px;}

  /* ---------- v1.12: required points, hint, confirm, editable letter ---------- */
  .required-box{background:#fff7de;border:2px solid var(--gold);border-radius:8px;padding:12px 14px;margin:0 0 16px;}
  .required-box h3{margin:0 0 6px;font-size:15px;color:var(--navy);}
  .required-box .required-text{font-size:14px;line-height:1.55;color:#3d2f17;}
  .required-box img{display:block;max-width:100%;margin:8px auto 0;border:2px solid var(--navy);border-radius:8px;}
  .hint-btn{margin:0 0 10px;padding:8px 14px;font-size:13px;}
  .hint-box{background:#eef6ff;border:1.5px dashed #2b5c8a;border-radius:8px;padding:10px 14px;margin:0 0 12px;font-size:14px;color:#1d3d5c;line-height:1.5;}
  .confirm-box{background:var(--card);border:2px dashed var(--green);border-radius:8px;padding:14px 16px;margin:16px 0 0;}
  .confirm-box.pending{border-color:var(--paper-shadow);color:#7a6a45;font-size:13px;}
  .confirm-box p{margin:0 0 10px;font-size:14px;color:#3d2f17;line-height:1.5;}
  .confirm-box .btn{background:var(--green);}
  textarea.letter-edit{
    background:#fffdf5;border:2px solid var(--green);border-radius:8px;padding:18px 20px;width:100%;
    font-family:'Caveat',cursive;font-size:19px;line-height:1.55;min-height:220px;color:#1c2a1a;resize:vertical;
  }
  .locked-note{font-size:13px;color:#2f5a22;background:var(--green-light);border-radius:6px;padding:8px 12px;margin:0 0 10px;}
  .ai-warning{background:#fff1d6;border:1.5px solid #c99a2e;border-radius:8px;padding:10px 14px;margin:0 0 14px;font-size:13.5px;color:#5b4321;line-height:1.5;}
  .ai-flag{font-size:12.5px;color:#8a5a00;margin-top:2px;}
  .lb-sub{font-size:11.5px;color:#8a5a00;display:block;margin-top:2px;white-space:normal;}

  /* ---------- v2: ladder, home extras, verdict ---------- */
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  .rank-card{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;background:var(--card);border:1.5px solid var(--gold);border-radius:8px;padding:10px 14px;margin:0 0 16px;font-size:13.5px;color:#3d2f17;text-align:center;}
  .rank-badge{font-family:'Special Elite',monospace;background:var(--navy);color:var(--paper);padding:4px 12px;border-radius:20px;font-size:14px;}
  .focus-card{background:#eef6ff;border:1.5px dashed #2b5c8a;border-radius:8px;padding:12px 16px;margin:0 0 18px;font-size:13.5px;color:#1d3d5c;line-height:1.5;}
  .focus-card h3{margin:0 0 4px;font-size:15px;color:var(--navy);}
  .focus-card ul{margin:4px 0 0;padding-left:20px;}
  .status-chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin:0 0 6px 6px;border:1.5px solid var(--paper-shadow);background:#fff;color:#3d2f17;}
  .status-chip.best{border-color:var(--gold);background:#fff7de;}
  .status-chip.mastered{border-color:var(--green);background:var(--green-light);color:#2f5a22;font-weight:600;}
  .level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 16px;}
  .level-card{background:var(--card);border:2px solid var(--paper-shadow);border-radius:8px;padding:10px 12px;font-size:13px;color:#3d2f17;line-height:1.4;}
  .level-card b{display:block;font-family:'Special Elite',monospace;font-size:14px;color:var(--navy);margin-bottom:2px;}
  .level-card.on{border-color:var(--green);background:var(--green-light);}
  .level-card.locked{opacity:.75;cursor:not-allowed;background:var(--paper-dark);}
  [role="button"].level-card.locked{cursor:not-allowed;}
  .register-line{background:#fff7de;border:1.5px dashed var(--gold);border-radius:8px;padding:9px 12px;font-size:13.5px;margin:0 0 12px;color:#5b4321;}
  .case-notes{background:var(--card);border:1.5px solid var(--paper-shadow);border-radius:8px;padding:8px 14px;margin:0 0 12px;font-size:13.5px;color:#3d2f17;}
  .case-notes summary{cursor:pointer;font-family:'Special Elite',monospace;color:var(--navy);padding:4px 0;}
  .case-notes h4{margin:10px 0 3px;font-size:13px;color:#5b4321;}
  .case-notes ul{margin:0;padding-left:20px;line-height:1.5;}
  .progress-sticky{position:sticky;top:0;z-index:5;background:var(--paper);border:1.5px solid var(--paper-shadow);border-radius:8px;padding:8px 12px;margin:0 0 12px;font-size:13px;color:#3d2f17;box-shadow:0 3px 8px rgba(0,0,0,.15);}
  .progress-sticky .bar-track{margin-top:5px;}
  .component{scroll-margin-top:84px;}
  /* v1.17 Step 4 stepper + format-specific preview */
  .draft-grid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start;}
  @media (min-width:880px){.draft-grid{grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);}.draft-side{position:sticky;top:84px;}}
  .part-rail{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;}
  .part-dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--paper-shadow);background:#fff;font:600 13px 'Lexend';color:#5b4321;cursor:pointer;position:relative;}
  .part-dot.done{background:var(--green-light);border-color:var(--green);color:#14532d;}
  .part-dot.done::after{content:"✓";position:absolute;right:-3px;top:-5px;font-size:11px;background:var(--green);color:#fff;border-radius:50%;width:15px;height:15px;line-height:15px;}
  .part-dot[aria-current="step"]{outline:3px solid var(--gold);outline-offset:2px;background:var(--navy);color:#fff;border-color:var(--navy);}
  .part-dot:focus-visible,.linkish:focus-visible{outline:3px solid #1d4ed8;outline-offset:2px;}
  .part-current{font-family:'Special Elite',monospace;color:var(--navy);font-size:14px;margin:0 0 8px;}
  .stepper:not(.all) .component{display:none;}
  .stepper:not(.all) .component.active{display:block;}
  .part-nav{display:flex;justify-content:space-between;gap:8px;margin:0 0 12px;}
  .part-nav .btn{min-height:44px;}
  .linkish{background:none;border:none;color:#1d4ed8;text-decoration:underline;cursor:pointer;font:13px 'Lexend';padding:6px 2px;min-height:32px;}
  .letter-preview.paper-letter{background:#fffdf6 repeating-linear-gradient(transparent 0 25px,rgba(120,100,60,.13) 25px 26px);border:1px solid var(--paper-shadow);box-shadow:0 2px 0 var(--paper-shadow),0 8px 14px rgba(0,0,0,.12);line-height:26px;position:relative;}
  .letter-preview .doc-stamp{display:inline-block;font:600 10px 'Lexend';letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--red);color:var(--red);padding:1px 7px;border-radius:3px;transform:rotate(-3deg);margin:0 0 8px;line-height:16px;}
  .letter-preview p{margin:0 0 12px;}
  .lp-salute{font-weight:600;} .lp-sign{margin:0 0 2px !important;}
  .letter-preview.paper-news{background:#f6f1e3;border:1px solid #bfb391;box-shadow:0 8px 14px rgba(0,0,0,.14);font-family:Georgia,'Times New Roman',serif;line-height:1.5;}
  .paper-news .np-mast{text-align:center;font:700 11px 'Special Elite',monospace;letter-spacing:.25em;border-bottom:3px double #6b5b3a;padding-bottom:5px;margin-bottom:10px;color:#4a3d22;}
  .paper-news .np-headline{font:800 22px/1.15 Georgia,serif;margin:0 0 4px;color:#1b1b1b;}
  .paper-news .np-byline{font:italic 13px Georgia,serif;color:#5b4a28;border-bottom:1px solid #cdbf98;padding-bottom:6px;margin:0 0 10px;}
    .letter-preview.paper-news{font-size:14.5px;}
  .paper-news .np-body p{margin:0 0 10px;text-align:justify;hyphens:auto;}
  .starters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;}
  .starter-chip{font-family:'Lexend';font-size:12.5px;padding:5px 11px;border-radius:20px;border:1.5px solid var(--gold);background:#fff7de;color:#3d2f17;cursor:pointer;}
  .starter-chip:hover{background:#ffefb8;}
  .starter-tip{font-size:12px;color:#7a6a45;margin:0 0 6px;}
  .word-count{font-size:13px;color:#5b4321;margin:6px 0 0;}
  .proof{background:var(--card);border:1.5px dashed var(--paper-shadow);border-radius:8px;padding:10px 14px;margin:14px 0 0;}
  .proof legend{font-family:'Special Elite',monospace;font-size:14px;color:var(--navy);padding:0 6px;}
  .proof label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin:6px 0;color:#3d2f17;line-height:1.4;}
  .proof input{margin-top:3px;accent-color:var(--green);}
  .missed-banner{background:#fde8e3;border:1.5px solid var(--red);border-radius:8px;padding:10px 14px;margin:0 0 14px;font-size:13.5px;color:#5a1f17;line-height:1.5;display:flex;gap:10px;justify-content:space-between;align-items:flex-start;}
  .missed-banner ul{margin:4px 0 0;padding-left:18px;}
  .missed-banner button{background:none;border:1.5px solid var(--red);color:var(--red-dark);border-radius:6px;font-size:12px;padding:4px 8px;cursor:pointer;white-space:nowrap;font-family:'Lexend';}
  .est-rows{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px;}
  .evidence-photo{display:block;position:relative;width:100%;max-width:480px;margin:6px auto 22px;padding:10px 10px 14px;background:#fff;border:1px solid #d8cfb4;box-shadow:0 6px 14px rgba(0,0,0,.25);transform:rotate(-1.2deg);cursor:zoom-in;}
  .evidence-photo img{display:block;width:100%;border:1px solid #cfc6a8;}
  .evidence-photo::before,.evidence-photo::after{content:"";position:absolute;top:-9px;width:62px;height:20px;background:rgba(232,214,150,.78);box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .evidence-photo::before{left:14px;transform:rotate(-6deg);} .evidence-photo::after{right:14px;transform:rotate(5deg);}
  .evidence-photo figcaption{font:12px 'Lexend';color:#7a6a45;text-align:center;margin-top:6px;}
  .evidence-photo.zoom{position:fixed;inset:12px;z-index:50;max-width:none;margin:0;transform:none;cursor:zoom-out;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,16,22,.94);border:none;}
  .evidence-photo.zoom img{max-height:88vh;width:auto;max-width:100%;object-fit:contain;} .evidence-photo.zoom::before,.evidence-photo.zoom::after{display:none;} .evidence-photo.zoom figcaption{color:#dbe4ee;}
  .progress-sticky .prog-row{display:flex;gap:10px;align-items:center;}
  .progress-sticky .prog-main{flex:1;min-width:0;}
  .casefile-btn{margin:0;white-space:nowrap;font-size:13px;padding:7px 12px;}
  .casefile-bar{display:flex;justify-content:flex-end;margin:0 0 10px;}
  body.cf-open{overflow:hidden;}
  dialog.casefile{padding:0;border:2px solid var(--navy);border-radius:10px;background:var(--paper);color:#3d2f17;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 18px 50px rgba(0,0,0,.5);}
  dialog.casefile::backdrop{background:rgba(10,16,22,.7);}
  .cf-inner{padding:16px 18px 20px;overflow:auto;max-height:calc(100vh - 36px);}
  .cf-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .cf-head h2{margin:0;font:400 18px 'Special Elite',monospace;color:var(--navy);}
  .cf-close{background:var(--navy);color:#fff;border:none;border-radius:8px;font:600 13px 'Lexend';padding:7px 12px;cursor:pointer;}
  .cf-sec{margin:12px 0 0;} .cf-sec h3{margin:0 0 4px;font:600 12px 'Lexend';letter-spacing:.06em;text-transform:uppercase;color:#7a6a45;}
  .cf-task{background:var(--card);border:1.5px solid var(--paper-shadow);border-radius:8px;padding:10px 12px;font-size:15px;line-height:1.55;white-space:pre-wrap;}
  .cf-pic{display:block;width:100%;max-width:520px;margin:0 auto;border:1px solid var(--paper-shadow);border-radius:6px;background:#fff;}
  @media (max-width:560px){dialog.casefile{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:14px 14px 0 0;max-height:88vh;}.cf-inner{max-height:88vh;}.progress-sticky .prog-row{flex-wrap:wrap;}}
  .case-closed{position:absolute;top:6px;right:6px;border:4px solid var(--red);color:var(--red);font:700 19px 'Special Elite',monospace;letter-spacing:.12em;padding:4px 12px;border-radius:6px;transform:rotate(-9deg);opacity:.88;pointer-events:none;animation:stampIn .26s cubic-bezier(.2,.9,.3,1.2) .7s backwards;}
  @keyframes stampIn{from{transform:rotate(-20deg) scale(2.1);opacity:0;}}
  .score-hero{position:relative;}
  @media (max-width:560px){.case-closed{position:static;display:inline-block;margin:6px 0 16px;font-size:16px;}}
  .gauge-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin:8px 0;}

  .gauge.hi .gfill{stroke:var(--green);} .gauge.mid .gfill{stroke:var(--gold);} .gauge.lo .gfill{stroke:var(--red);}
  @media (prefers-reduced-motion:reduce){.gauge .gfill{transition:none;}}
  .rank-badge svg{vertical-align:-4px;margin-right:4px;}
  .est-pill{background:var(--card);border:1.5px solid var(--paper-shadow);border-radius:8px;padding:6px 12px;font-size:14px;color:#3d2f17;}

  .v-section{margin:18px 0 0;}

  .check-list li.found{border-color:var(--green);}
  .check-list li.missing{border-color:var(--red);}
  .check-list li.partial{border-color:var(--gold);}
  .look-list{margin:0;padding-left:20px;font-size:14px;line-height:1.6;color:#3d2f17;}
  mark{background:#ffe58a;color:inherit;border-radius:3px;padding:0 2px;}
  .fix-card{background:#eef6ff;border:2px solid #2b5c8a;border-radius:10px;padding:14px 16px;margin-top:18px;}
  .fix-card h3{margin:0 0 6px;font-size:16px;color:var(--navy);}
  .fix-card p{margin:0 0 8px;font-size:14px;color:#1d3d5c;line-height:1.5;}
  .fix-msg{font-size:14px;margin-top:8px;color:#1d3d5c;min-height:1em;}
  .fix-msg.ok{color:#2f5a22;font-weight:600;}
  .nudge{background:var(--green-light);border:1.5px solid var(--green);border-radius:8px;padding:10px 14px;margin-top:18px;font-size:14px;color:#2f5a22;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
  details.model-d{background:var(--card);border:1.5px dashed var(--paper-shadow);border-radius:8px;padding:10px 14px;margin-top:18px;font-size:14px;}
  details.model-d summary{cursor:pointer;font-family:'Special Elite',monospace;color:var(--navy);}
  .verdict-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:22px;}
  .lb-tabs{display:flex;gap:6px;margin:0 0 12px;justify-content:center;}
  .lb-tab{font-family:'Special Elite',monospace;font-size:13px;padding:6px 14px;border-radius:20px;border:1.5px solid #f4e8c8;background:transparent;color:#f4e8c8;cursor:pointer;}
  .lb-tab[aria-selected="true"]{background:#f4e8c8;color:#3a2a1a;}
  .lb-hide{display:flex;gap:8px;align-items:center;font-size:12.5px;color:#f4e8c8;margin:0 0 12px;}
  .lb-hide input{accent-color:var(--gold);}
  .lb-sub.light{color:#7a6a45;}
  @media (prefers-reduced-motion: reduce){
    *{scroll-behavior:auto !important;transition:none !important;animation:none !important;}
  }

  /* ---------- nav buttons ---------- */
  .nav-row{display:flex;justify-content:space-between;margin-top:22px;gap:10px;}
  .btn{
    font-family:'Special Elite',monospace;font-size:14px;padding:11px 20px;border-radius:8px;

  .btn.secondary{background:transparent;border:1.5px solid var(--paper-shadow);color:#5b4321;}

  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn:hover:not(:disabled){filter:brightness(1.08);}

  /* ---------- results ---------- */
  .score-hero{text-align:center;margin-bottom:20px;}
  .score-hero .big{font-size:56px;font-family:'Special Elite',monospace;color:var(--red);}
  .score-hero .of{font-size:16px;color:#5b4321;}
  .bar-row{margin-bottom:10px;}
  .bar-row .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px;color:#5b4321;}
  .bar-track{background:var(--paper-dark);border-radius:6px;height:10px;overflow:hidden;}
  .bar-fill{background:var(--green);height:100%;}
  .ai-note{font-size:12.5px;color:#5b4321;font-style:italic;margin-top:2px;}
  .model-compare{
    background:var(--card);border:1.5px dashed var(--paper-shadow);border-radius:8px;padding:16px;margin-top:18px;
    font-size:14px;white-space:pre-wrap;line-height:1.6;
  }
  .improve-box{
    background:#fff7de;border:2px solid var(--gold);border-radius:10px;padding:16px 18px;margin-top:18px;

  .tips-list{margin:0;padding-left:20px;font-size:13.5px;color:#5b4321;line-height:1.6;}

  /* ---------- leaderboard ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(10,10,10,.6);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .board{
    background:#3a2a1a;background-image:radial-gradient(#00000022 1px, transparent 1px);background-size:6px 6px;
    border-radius:12px;max-width:520px;width:100%;max-height:80vh;overflow:auto;padding:22px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .board h2{color:#f4e8c8;text-align:center;margin-top:0;}
  .board-close{float:right;background:none;border:none;color:#f4e8c8;font-size:18px;cursor:pointer;}
  .lb-row{
    background:#fdf3d6;border-radius:6px;padding:9px 12px;margin-bottom:8px;
    display:flex;justify-content:space-between;font-size:14px;transform:rotate(-.4deg);
    box-shadow:1px 2px 4px rgba(0,0,0,.3);
  }
  .lb-row:nth-child(even){transform:rotate(.4deg);}
  .lb-rank{font-family:'Special Elite',monospace;color:var(--red);margin-right:8px;}
  .lb-name{font-weight:600;}
  .lb-case{color:#7a6a45;font-size:12px;display:block;}
  .lb-score{font-family:'Special Elite',monospace;color:var(--green);}

  .footer-link{text-align:center;margin-top:26px;}
  .footer-link a{color:#9fb2c9;font-size:12px;text-decoration:none;}
  .footer-link a:hover{text-decoration:underline;}

  @media (max-width:600px){
    .score-hero .big{font-size:42px;}
  }

  /* ---------- mobile (Chromebooks/tablets/phones) ---------- */
  @media (max-width:480px){
    .wrap{padding:10px 8px 40px;}
    .topbar{padding:10px 12px;flex-wrap:wrap;gap:8px;justify-content:center;}
    .brand{font-size:16px;}
    .brand .badge{width:28px;height:28px;font-size:15px;}
    .topbar-actions{display:flex;gap:6px;}
    .topbar-actions button{font-size:11.5px;padding:6px 9px;}
    .panel{padding:16px 14px 20px;}
    .panel::before{inset:5px;}
    .stamp{position:static;display:inline-block;transform:none;margin:0 0 8px;font-size:11px;padding:3px 8px;}
    .level-grid{gap:6px;}
    .level-card{font-size:0;padding:8px 6px;text-align:center;}
    .level-card b{font-size:12px;margin:0;}
    .agency-title{font-size:22px;}
    .case-grid,.evidence-grid{grid-template-columns:1fr;}
    .name-row{flex-direction:column;align-items:stretch;}
    .name-row input{min-width:0;}
    .due-item{flex-direction:column;align-items:flex-start;gap:2px;}
    .tabs{gap:4px;}
    .tab{font-size:11px;padding:6px 8px;flex:1 1 auto;text-align:center;}
    .step-title{font-size:18px;}
    .nav-row{flex-direction:column-reverse;}
    .nav-row .btn{width:100%;}
    .chunk-picker{gap:6px;}
    .chunk-picker button{font-size:12px;padding:6px 10px;}
    .component{padding:12px;}
    .board{padding:16px;max-height:85vh;}
    .level-grid{grid-template-columns:1fr;}
    .verdict-actions{flex-direction:column;}
    .verdict-actions .btn{width:100%;}
    .missed-banner{flex-direction:column;}
    .rank-card{flex-direction:column;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="badge">🚨</span> Boss! There's a situation!</div>
  <div class="topbar-actions">
    <button id="btnMyScores">📈 My Scores</button>
    <button id="btnLeaderboard">🏆 Leaderboard</button>
  </div>
</div>

<div class="wrap" id="app"></div>

<div class="footer-link"><a href="/admin.html">Teacher / Admin tools →</a> <span style="color:#5b6a78;">· v2.1</span></div>

<script>

const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));
const app = $("#app");

// localStorage can throw (private mode, blocked, full) — never let it break the game.
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }

let memDeviceId = "";
function getOrCreateDeviceId() {
  let id = lsGet("detectiveDeviceId");
  if (!id) {
    id = memDeviceId || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
    memDeviceId = id;
    lsSet("detectiveDeviceId", id);
  }
  return id;
}

let state = {
  screen: "launch",
  cases: [],
  dueCases: [],
  currentCase: null,
  step: 0,
  playerName: lsGet("detectiveName") || "",
  playerClass: lsGet("detectiveClass") || "",
  deviceId: getOrCreateDeviceId(),
  taskAnswers: {},
  stimulusSelected: new Set(),
  ownContent: "",
  componentChoices: {},
  signOffName: "",
  componentResponses: {},
  paragraphBreaks: new Set(),
  confirmed: false,   // v1.12: letter confirmed in Step 4 => preview becomes editable
  finalLetter: "",    // v1.12: the (possibly hand-edited) letter text once confirmed (Level 3: the whole letter)
  hintOpen: false,    // v1.12: Step 3 hint revealed
  result: null,
  studentAccessEnabled: true,
  level: 1,           // v2: writing ladder level chosen for the current draft (1 Guided, 2 Starters, 3 Independent)
  profile: null,      // v2: from /api/my-scores
  config: null,       // v2: from /api/config
  missedInfo: null,   // v2: "Last time you missed" info for the open case
};

const STEPS = ["Briefing", "Evidence", "Hunch", "Draft", "Verdict"];

// v1.15: a case is a formal letter, an informal letter or an article.
function caseFormat(c) {
  if (c && (c.format === "article" || c.format === "formal_letter" || c.format === "informal_letter")) return c.format;
  return c && c.formal === false ? "informal_letter" : "formal_letter";
}
const isArticleCase = (c) => caseFormat(c) === "article";
/** "letter" or "article" for the case on screen (or the one given). */
const docWord = (c) => (isArticleCase(c || state.currentCase) ? "article" : "letter");
const FORMAT_TAG = { formal_letter: ["Formal", ""], informal_letter: ["Informal", "informal"], article: ["Article", "article"] };
const LEVELS = [
  { n: 1, name: "Guided", desc: "Pick one of 3 suggestions for each part, or write your own." },
  { n: 2, name: "Starters", desc: "Write each part in your own words, helped by sentence starters." },
  { n: 3, name: "Independent", desc: "Write the whole piece yourself from a blank page." },
];

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error || ("Request failed: " + res.status));
  }
  return res.json();
}

function resetCaseState() {
  state.step = 0;
  state.taskAnswers = {};
  state.stimulusSelected = new Set();
  state.ownContent = "";
  state.componentChoices = {};
  state.paragraphBreaks = new Set();
  state.signOffName = "";
  state.componentResponses = {};
  state.activePart = undefined;
  state.confirmed = false;
  state.finalLetter = "";
  state.hintOpen = false;
  state.result = null;
  state.missedInfo = null;
  // state.level is deliberately kept so a pupil stays on the level they chose.
}

function identityQs() {
  return "?name=" + encodeURIComponent(state.playerName) + "&playerClass=" + encodeURIComponent(state.playerClass || "") + "&deviceId=" + encodeURIComponent(state.deviceId || "");
}

/** Highest level this pupil may use. Any failure => Level 1 only. */
function unlockedLevel() {
  let n = 1;
  const p = state.profile && Number(state.profile.unlockedLevel);
  if (p >= 1 && p <= 3) n = Math.max(n, Math.floor(p));
  if (state.config && state.config.allLevelsUnlocked) n = 3;
  return n;
}

async function fetchMeta() {
  const jobs = [
    api("/api/config").then((d) => { state.config = d || null; }).catch(() => {}),
  ];
  if (state.playerName) {
    jobs.push(api("/api/my-scores" + identityQs()).then((d) => { state.profile = (d && d.profile) || null; }).catch(() => {}));
  }
  await Promise.all(jobs);
}

async function loadHome() {
  if (!state.playerName) { state.screen = "launch"; render(); return; }
  state.screen = "home";
  render();
  await Promise.all([
    (async () => {
      try {
        const data = await api("/api/cases");
        state.cases = data.cases || [];
        state.studentAccessEnabled = data.studentAccessEnabled !== false;
      } catch (e) { state.cases = []; }
    })(),
    (async () => {
      try {
        const dueData = await api("/api/practice-due" + identityQs());
        state.dueCases = dueData.due || [];
      } catch (e) { state.dueCases = []; }
    })(),
    fetchMeta(),
  ]);
  if (state.screen === "home") render();
}

function render() {
  if (state.screen === "launch") return renderLaunch();
  if (state.screen === "home") return renderHome();
  if (state.screen === "case") return renderCase();
}

// ---- Launch screen: pupils identify themselves as Name@Class ----
function parseIdentity(raw) {
  const s = (raw || "").trim();
  if (!s) return { name: "", cls: "" };
  const at = s.indexOf("@");
  if (at === -1) return { name: s, cls: "" };
  return { name: s.slice(0, at).trim(), cls: s.slice(at + 1).trim().toUpperCase() };
}

function renderLaunch() {
  const prefill = state.playerName ? (state.playerClass ? `${state.playerName}@${state.playerClass}` : state.playerName) : "";
  app.innerHTML = `
    <div class="panel" style="max-width:480px;margin:20px auto;">
      <div class="stamp">SIGN IN</div>
      <div class="agency-title" style="font-size:24px;">Detective, identify yourself</div>
      <p class="agency-sub">Enter your name and class like <b>John@5IG</b>, then head into the case files.</p>
      <div class="name-row" style="flex-direction:column;align-items:stretch;">
        <input id="launchInput" aria-label="Your name and class, like John@5IG" placeholder="e.g. John@5IG" value="${escapeHtml(prefill)}" maxlength="60" style="width:100%;text-align:center;"/>
      </div>
      <div id="launchMsg" class="hint" role="status" style="text-align:center;margin-bottom:10px;"></div>
      <button class="btn primary" id="launchGo" style="width:100%;">Enter the Agency →</button>
    </div>
  `;
  const input = $("#launchInput");
  const msg = $("#launchMsg");
  const go = () => {
    const { name, cls } = parseIdentity(input.value);
    if (!name) { msg.textContent = "Please enter at least your name (e.g. John@5IG)."; return; }
    if (name !== state.playerName || cls !== state.playerClass) { state.profile = null; }
    state.playerName = name;
    state.playerClass = cls;
    lsSet("detectiveName", name);
    lsSet("detectiveClass", cls);
    loadHome();
  };
  $("#launchGo").addEventListener("click", go);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  input.focus();
}

function caseStatus(caseId) {
  const bests = state.profile && state.profile.bests;
  const b = bests && bests[caseId];
  if (!b) return { key: "new", text: "New", icon: "🆕" };
  if (b.mastered) return { key: "mastered", text: "Mastered", icon: "✔" };
  const pct = b.max ? Math.round((Number(b.best) / Number(b.max)) * 100) : 0;
  return { key: "best", text: "Best " + pct + "%", icon: "🎯" };
}

function renderHome() {
  const due = state.dueCases || [];
  const prof = state.profile;
  const rank = prof && prof.rank;
  const weak = (prof && Array.isArray(prof.weaknesses) ? prof.weaknesses : []).filter((w) => w && w.label).slice(0, 3);
  let rankHtml = "";
  if (rank && rank.title) {
    let nextTxt = "";
    if (rank.next && rank.next.title) {
      const n = Number(rank.next.casesNeeded) || 0;
      nextTxt = `<span>${n} more case${n === 1 ? "" : "s"} to ${escapeHtml(rank.next.title)}</span>`;
    } else {
      nextTxt = `<span>Top rank reached — well done!</span>`;
    }
    const mc = Number(prof.masteredCount);
    rankHtml = `
      <div class="rank-card" aria-label="Your detective rank">
        <span class="rank-badge">${RANK_SVG}${escapeHtml(rank.title)}</span>
        ${nextTxt}
        ${Number.isFinite(mc) ? `<span>${mc} case${mc === 1 ? "" : "s"} mastered</span>` : ""}
      </div>`;
  }
  const focusHtml = weak.length ? `
    <div class="focus-card">
      <h3>🎯 Your next focus</h3>
      <ul>${weak.map((w) => `<li>You often: ${escapeHtml(w.label)}</li>`).join("")}</ul>
    </div>` : "";
  app.innerHTML = `
    <div class="panel">
      <div class="stamp">INBOX</div>
      <div class="agency-title">Boss! There's a situation!</div>
      <p class="agency-sub">Your boss just fired off another urgent message. Investigate the situation like a detective, then draft the perfect reply.</p>
      <div style="text-align:center;margin-bottom:20px;font-size:13.5px;color:#5b4321;">
        Detective <b>${escapeHtml(state.playerName)}</b>${state.playerClass ? ` <span class="hint">(Class ${escapeHtml(state.playerClass)})</span>` : ""}
        &nbsp;·&nbsp;<a href="#" id="switchDetective" style="color:#8a6a2e;">Not you? Switch detective</a>
      </div>
      ${rankHtml}
      ${focusHtml}
      ${due.length ? `
        <div class="due-panel">
          <div class="due-title">📌 Cases due for another look</div>
          <p class="hint" style="margin:2px 0 10px;">You haven't quite cracked these yet — worth a retry.</p>
          <div class="due-list">
            ${due.map((d) => `
              <div class="due-item" data-id="${escapeHtml(d.caseId)}" role="button" tabindex="0" aria-label="Retry case: ${escapeHtml(d.caseTitle)}. Last try: ${escapeHtml(d.lastScore)} out of ${escapeHtml(d.max)}.">
                <span>${escapeHtml(d.caseTitle)}</span>
                <span class="due-score">Last try: ${escapeHtml(d.lastScore)}/${escapeHtml(d.max)}</span>
              </div>
            `).join("")}
          </div>
        </div>
      ` : ""}
      ${state.studentAccessEnabled === false ? `<div class="msg error" style="margin-top:16px;">Case access is currently disabled by your teacher. Please try again later.</div>` : `
        <div class="case-grid" id="caseGrid">
          ${state.cases.length ? state.cases.map(caseCardHtml).join("") : `<p style="color:#5b4321">No cases are currently available.</p>`}
        </div>
      `}
    </div>
  `;
  $("#switchDetective").addEventListener("click", (e) => {
    e.preventDefault();
    state.screen = "launch";
    render();
  });
  const openOnActivate = (el) => {
    el.addEventListener("click", () => openCase(el.dataset.id));
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") { e.preventDefault(); openCase(el.dataset.id); }
    });
  };
  $$(".due-item").forEach(openOnActivate);
  $$(".case-card").forEach(openOnActivate);
}

function caseCardHtml(c) {
  const st = caseStatus(c.id);
  return `
    <div class="case-card" data-id="${escapeHtml(c.id)}" role="button" tabindex="0" aria-label="Open case: ${escapeHtml(c.title)} (${FORMAT_TAG[caseFormat(c)][0].toLowerCase()} writing). Status: ${escapeHtml(st.text)}.">
      ${(c.imageUrl || c.imageData) ? `<img src="${escapeHtml(c.imageUrl || c.imageData)}" alt="" loading="lazy" />` : ""}
      <div class="body">
        <span class="tag ${FORMAT_TAG[caseFormat(c)][1]}">${FORMAT_TAG[caseFormat(c)][0]}</span><span class="status-chip ${st.key}">${st.icon} ${escapeHtml(st.text)}</span>
        <h3>${escapeHtml(c.title)}</h3>
      </div>
    </div>
  `;
}

function draftStorageKey(caseId) {
  return "draftProgress:" + caseId;
}

/** Saves everything needed to resume this attempt after a refresh or a
 * dropped connection — school wifi is not always reliable, and losing a
 * half-built letter is a bad experience. Cleared on successful submit. */
function persistProgress() {
  if (!state.currentCase) return;
  lsSet(draftStorageKey(state.currentCase.id), JSON.stringify({
    step: state.step,
    taskAnswers: state.taskAnswers,
    stimulusSelected: Array.from(state.stimulusSelected),
    ownContent: state.ownContent,
    componentChoices: state.componentChoices,
    componentResponses: state.componentResponses,
    paragraphBreaks: Array.from(state.paragraphBreaks),
    signOffName: state.signOffName,
    confirmed: state.confirmed,
    finalLetter: state.finalLetter,
    level: state.level,
  }));
}

function restoreProgress(caseId) {
  try {
    const raw = lsGet(draftStorageKey(caseId));
    if (!raw) return false;
    const saved = JSON.parse(raw);
    state.step = Math.min(saved.step || 0, 3);
    state.taskAnswers = saved.taskAnswers || {};
    state.stimulusSelected = new Set(saved.stimulusSelected || []);
    state.ownContent = saved.ownContent || "";
    state.componentChoices = saved.componentChoices || {};
    state.componentResponses = saved.componentResponses || {};
    state.paragraphBreaks = new Set(saved.paragraphBreaks || []);
    state.signOffName = saved.signOffName || "";
    state.confirmed = !!saved.confirmed;
    state.finalLetter = saved.finalLetter || "";
    const lv = Number(saved.level);
    state.level = (lv >= 1 && lv <= 3) ? Math.floor(lv) : 1;
    return true;
  } catch (e) {
    return false;
  }
}

function clearProgress(caseId) {
  lsDel(draftStorageKey(caseId));
}

// ---- "Last time you missed" (retry help), kept per case in localStorage ----
function missedKey(caseId) { return "bossMissed:" + caseId; }
function loadMissed(caseId) {
  try {
    const raw = lsGet(missedKey(caseId));
    if (!raw) return null;
    const d = JSON.parse(raw);
    const missed = Array.isArray(d.missed) ? d.missed.filter((x) => typeof x === "string" && x) : [];
    const flags = Array.isArray(d.flags) ? d.flags.filter((f) => f && f.label) : [];
    return (missed.length || flags.length) ? { missed, flags } : null;
  } catch (e) { return null; }
}
function saveMissed(caseId, r) {
  const points = (r.checklist && Array.isArray(r.checklist.points)) ? r.checklist.points : [];
  const missed = points.filter((p) => p && p.status !== "found" && p.text).map((p) => String(p.text));
  const flags = (Array.isArray(r.flags) ? r.flags : []).filter((f) => f && f.label).map((f) => ({ code: f.code, label: f.label }));
  if (!missed.length && !flags.length) { lsDel(missedKey(caseId)); return; }
  lsSet(missedKey(caseId), JSON.stringify({ missed, flags, ts: Date.now() }));
}
function missedBannerHtml() {
  const m = state.missedInfo;
  if (!m) return "";
  return `
    <div class="missed-banner" id="missedBanner" role="note">
      <div><b>Last time you missed:</b>
        <ul>
          ${m.missed.map((t) => `<li>${escapeHtml(t)}</li>`).join("")}
          ${m.flags.map((f) => `<li>${escapeHtml(f.label)}</li>`).join("")}
        </ul>
      </div>
      <button type="button" id="missedDismiss" aria-label="Dismiss the reminder about what you missed last time">✕ Dismiss</button>
    </div>`;
}
function bindMissedBanner(body) {
  const btn = $("#missedDismiss", body);
  if (!btn) return;
  btn.addEventListener("click", () => {
    const caseId = state.currentCase && state.currentCase.id;
    state.missedInfo = null;
    if (caseId) lsDel(missedKey(caseId));

    if (el) el.remove();

}

async function openCase(id, opts) {
  opts = opts || {};
  resetCaseState();
  state.screen = "case";
  state.currentCase = null;
  render();
  try {
    const data = await api("/api/cases/" + id);
    // Shuffle each MCQ component's option DISPLAY order once per case
    // load. Option ids are opaque strings, so position gives nothing away.
    if (data.case && Array.isArray(data.case.components)) {
      data.case.components = data.case.components.map((comp) => ({
        ...comp,
        options: shuffleArray((comp.options || []).slice()),
      }));
    }
    // Evidence tiles arrive with the correct ones first; shuffle them so
    // position gives nothing away (selection is tracked by id, not position).
    if (data.case && Array.isArray(data.case.stimulusPoints)) {
      data.case.stimulusPoints = shuffleArray(data.case.stimulusPoints.slice());
    }
    state.currentCase = data.case;
    const restored = restoreProgress(id); // no-op if there's nothing saved for this case
    if (!restored || opts.level) {
      const want = opts.level || state.level || 1;
      state.level = Math.max(1, Math.min(want, unlockedLevel()));
    }
    state.missedInfo = loadMissed(id);
  } catch (e) {
    alert("Could not open that case: " + e.message);
    state.screen = "home";
  }
  render();
  window.scrollTo(0, 0);
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function renderCase() {
  const c = state.currentCase;
  if (!c) { app.innerHTML = `<div class="panel">Loading case file…</div>`; return; }
  const tabsHtml = STEPS.map((label, i) => {
    let cls = "tab";
    if (i === state.step) cls += " active";
    if (i < state.step) cls += " done";
    return `<div class="${cls}"${i === state.step ? ' aria-current="step"' : ""}>${i+1}. ${label}</div>`;
  }).join("");

  app.innerHTML = `
    <div class="panel">
      <div class="stamp stamp-case">${escapeHtml(c.title)}</div>
      <div class="tabs">${tabsHtml}</div>
      <div id="stepBody"></div>
    </div>
  `;
  const body = $("#stepBody");
  if (state.step === 0) renderBriefing(body, c);
  else if (state.step === 1) renderEvidence(body, c);
  else if (state.step === 2) renderHunch(body, c);
  else if (state.step === 3) renderDraft(body, c);
  else renderVerdict(body, c);
}

function navRow(container, { backLabel="← Back", nextLabel="Next →", onBack, onNext, nextDisabled=false }) {
  const row = document.createElement("div");
  row.className = "nav-row";
  row.innerHTML = `
    <button class="btn secondary" id="navBack">${backLabel}</button>
    ${nextLabel === null ? "" : `<button class="btn primary" id="navNext" ${nextDisabled ? "disabled" : ""}>${nextLabel}</button>`}
  `;
  container.appendChild(row);
  $("#navBack", row).addEventListener("click", onBack);
  if (nextLabel !== null) $("#navNext", row).addEventListener("click", onNext);
}

// ---- Step 0: Briefing (task purpose/audience/context) ----
function renderBriefing(body, c) {
  const chunkTypes = ["purpose", "audience", "context", "other"];
  let selectedChunk = null;

  body.innerHTML = `
    <h2 class="step-title">🕵️ Step 1 — The Briefing</h2>
    <p class="step-instr">Click a piece of the task below, then tag it: is it the <b>Purpose</b> (why you're writing), the <b>Audience</b> (who you're writing to), or the <b>Context</b> (the situation)? Some phrases are just filler — mark those "Not needed".</p>
    <div class="task-text" id="taskText"></div>
    <div class="chunk-picker" id="picker" style="display:none;">
      <span style="align-self:center;font-size:13px;color:#5b4321;">Tag this clue as:</span>
      <button class="purpose" data-t="purpose">🎯 Purpose</button>
      <button class="audience" data-t="audience">👤 Audience</button>
      <button class="context" data-t="context">📍 Context</button>
      <button data-t="other">— Not needed</button>
    </div>
  `;
  const TAG_ICON = { purpose: "🎯", audience: "👤", context: "📍", other: "—" };
  const TAG_NAME = { purpose: "Purpose", audience: "Audience", context: "Context", other: "Not needed" };
  const taskTextEl = $("#taskText", body);
  taskTextEl.innerHTML = c.taskChunks.map((chunk) => {
    const tag = state.taskAnswers[chunk.id];
    const label = tag ? `Tagged as ${TAG_NAME[tag]}: ${chunk.text}. Activate to change the tag.` : `Untagged: ${chunk.text}. Activate to tag it.`;
    return `<span class="chunk ${tag ? "tag-" + tag : ""}" data-id="${escapeHtml(chunk.id)}" role="button" tabindex="0" aria-label="${escapeHtml(label)}">${escapeHtml(chunk.text)}${tag ? `<span class="tag-icon" aria-hidden="true">${TAG_ICON[tag]}</span>` : ""}</span> `;
  }).join("");

  const pickChunk = (el) => {
    selectedChunk = el.dataset.id;
    $("#picker", body).style.display = "flex";
    $$(".chunk", taskTextEl).forEach((x) => x.style.outline = "none");
    el.style.outline = "2px solid " + getComputedStyle(document.documentElement).getPropertyValue("--gold");
    // Move focus into the picker so keyboard/screen-reader users land
    // straight on the tag choices instead of having to hunt for them.
    const firstPickerBtn = $("#picker button", body);
    if (firstPickerBtn) firstPickerBtn.focus();
  };
  $$(".chunk", taskTextEl).forEach((el) => {
    el.addEventListener("click", () => pickChunk(el));
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") { e.preventDefault(); pickChunk(el); }
    });
  });
  $$("#picker button", body).forEach((btn) => {
    btn.addEventListener("click", () => {
      if (!selectedChunk) return;
      const taggedId = selectedChunk;
      state.taskAnswers[selectedChunk] = btn.dataset.t;
      persistProgress();
      renderBriefing(body, c);
      // Return focus to the chunk that was just tagged, since the whole
      // step re-renders — otherwise a keyboard user's focus silently
      // drops back to the document body after every tag.
      const retagged = $(`.chunk[data-id="${taggedId}"]`, body);
      if (retagged) retagged.focus();
    });
  });

  const tagged = Object.keys(state.taskAnswers).length;
  navRow(body, {
    backLabel: "← Case Files", nextLabel: "Next: Evidence →",
    nextDisabled: tagged < Math.min(3, c.taskChunks.length),
    onBack: () => { state.screen = "home"; render(); },
    onNext: () => { state.step = 1; persistProgress(); render(); },
  });
}

/** SVG ring gauge. Colour is reinforced by the number and an aria-label. */
function gaugeHtml(score, max, label) {
  const sc = Number(score) || 0, mx = Number(max) || 1, frac = Math.max(0, Math.min(1, sc / mx));
  const R = 34, C = 2 * Math.PI * R, band = frac >= 0.75 ? "hi" : frac >= 0.5 ? "mid" : "lo";
  return `<div class="gauge ${band}" role="img" aria-label="${escapeHtml(label)}: ${sc} out of ${mx}">
    <svg width="88" height="88" viewBox="0 0 88 88" aria-hidden="true"><circle class="gtrack" cx="44" cy="44" r="${R}" fill="none" stroke-width="9"/><circle class="gfill" cx="44" cy="44" r="${R}" fill="none" stroke-width="9" stroke-linecap="round" transform="rotate(-90 44 44)" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" data-off="${(C * (1 - frac)).toFixed(1)}"/><text x="44" y="49" text-anchor="middle" font-family="Special Elite, monospace" font-size="17" fill="#1B2A38">${sc}/${mx}</text></svg>${escapeHtml(label)}</div>`;
}
/** Gauges are drawn empty, then filled on the next frames so the CSS transition actually plays. */
function animateGauges(root) {
  const fills = $$(".gfill[data-off]", root);
  if (!fills.length) return;
  const go = () => fills.forEach((el) => el.setAttribute("stroke-dashoffset", el.dataset.off));
  if (prefersReducedMotion() || typeof requestAnimationFrame !== "function") { go(); return; }
  requestAnimationFrame(() => requestAnimationFrame(go));
}
const RANK_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.2 8 11 4.6-1.8 8-6 8-11V5z" fill="#C99A2E" stroke="#F4E7BF" stroke-width="1.2"/><circle cx="11" cy="11" r="3.6" fill="none" stroke="#1B2A38" stroke-width="1.8"/><path d="m13.8 13.8 3.4 3.4" stroke="#1B2A38" stroke-width="1.8" stroke-linecap="round"/></svg>';

const STARTERS = {
  headline: ["Come and Join …!", "Why You Should …", "Have You Heard About …?"],
  hook: ["Have you ever …?", "Imagine …", "What if you could …?"],
  cta: ["So why not …?", "Join us on …", "Remember to …"],
  thanks: ["Thank you for reading, and …", "Thank you for your time, and …"],
  salutation: ["Dear Mr/Ms …,", "Dear Sir/Madam,", "Hi …,"],
  greeting: ["I hope you are well.", "I hope this message finds you well."],
  purpose: ["I am writing to…", "I am writing because…"],
  context: ["Recently, …", "As you may know, …"],
  keyinfo: ["I understand that…", "Please note that…", "The details are as follows: …"],
  ownIdea: ["Since I cannot…, I would like to…", "To help, I could…"],
  closing: ["Thank you for…", "I look forward to…"],
  signoff: ["Yours sincerely,", "Yours faithfully,", "Best wishes,"],

function startersFor(comp) {
  const k = String(comp.key || "");
  if (k === "name") return [state.playerName || "Your name"];
  if (k === "byline") return ["By " + (state.playerName || "Your Full Name")];
  if (STARTERS[k]) return STARTERS[k];
  if (/^keyinfo/i.test(k)) return STARTERS.keyinfo;
  return ["I would like to…", "Please note that…"];
}

function prefersReducedMotion() {
  try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; }

function countWords(t) {

      state.level = n;
      state.componentChoices = {};
      state.componentResponses = {};

    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") { e.preventDefault(); choose(); }
