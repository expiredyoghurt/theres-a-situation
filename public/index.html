      <summary>📓 My case notes</summary>
      <h4>Step 1 — my tags</h4>
      ${tagged.length ? `<ul>${tagged.map((ch) => `<li>${escapeHtml(TAG_NAME[state.taskAnswers[ch.id]] || state.taskAnswers[ch.id])}: ${escapeHtml(ch.text)}</li>`).join("")}</ul>` : `<p class="field-note">No tags yet.</p>`}
      <h4>Step 2 — evidence I pinned</h4>
      ${pinned.length ? `<ul>${pinned.map((p) => `<li>${escapeHtml(p.text)}</li>`).join("")}</ul>` : `<p class="field-note">Nothing pinned.</p>`}
      <h4>Step 3 — my hunch</h4>
      ${hunch ? `<p style="margin:0;white-space:pre-wrap;">${escapeHtml(hunch)}</p>` : `<p class="field-note">No hunch written.</p>`}
    </details>`;
}

function proofreadHtml() {
  const article = isArticleCase(state.currentCase);
  const items = article ? [
    "Capital letters at the start of sentences",
    "Full stops at the ends of sentences",
    "Names, dates and times copied correctly",
    "Headline on its own line and byline with my first and last name",
    "A call to action and a thank-you at the end",
    "One paragraph for each main idea, with linking words (Furthermore, Moreover, However)",
  ] : [
    "Capital letters at the start of sentences",
    "Full stops at the ends of sentences",
    "Names, dates and times copied correctly",
    "Salutation and sign-off match (Dear Sir/Madam → Yours faithfully; Dear Mr/Ms Name → Yours sincerely)",
    "One paragraph for each main idea",
  ];
  return `
    <fieldset class="proof">
      <legend>🔍 Proofread checklist</legend>
      <p class="field-note" style="margin:0 0 4px;">Tick each one as you check your ${docWord()}. These are reminders — you can still submit anytime.</p>
      ${items.map((t, i) => `<label for="proof${i}"><input type="checkbox" id="proof${i}"/> <span>${escapeHtml(t)}</span></label>`).join("")}
    </fieldset>`;
}

function draftInstr() {
  if (state.level === 2) return `For every part, write your own words. Tap a <b>sentence starter</b> to begin, then finish the sentence. Use the paragraph checkbox where a new paragraph should begin.`;
  if (state.level === 3) return `Write your whole reply on your own — no suggestions this time. Use what you found in Steps 1 to 3.`;
  return `For every part, choose one of the 3 suggestions <b>or type your own response</b>. Use the paragraph checkbox where a new paragraph should begin.`;
}

function renderDraft(body, c) {
  if (state.confirmed && state.level !== 3) { renderDraftConfirmed(body, c); return; }
  if (state.level === 3) { renderDraftIndependent(body, c); return; }
  const lvl = state.level;
  body.innerHTML = `
    <h2 class="step-title">✍️ Step 4 — Draft Your Report</h2>
    ${missedBannerHtml()}
    ${levelChooserHtml()}
    <p class="step-instr">${draftInstr()}</p>
    ${registerLineHtml(c)}
    ${lvl === 2 ? caseNotesHtml(c) : ""}
    <div class="progress-sticky" id="progressSticky" role="status" aria-live="polite"></div>
    <div class="draft-grid">
      <div class="draft-main">
        <nav class="part-rail" id="partRail" aria-label="Parts of your ${docWord(c)}"></nav>
        <p class="part-current" id="partCurrent"></p>
        <div id="components" class="stepper${state.showAllParts ? " all" : ""}"></div>
        <div class="part-nav" id="partNav"></div>
        <button type="button" class="linkish" id="toggleAll">${state.showAllParts ? "Show one part at a time" : "Show all parts on one page"}</button>
      </div>
      <aside class="draft-side">
        <h3 style="color:var(--navy);font-size:15px;margin:0 0 6px;">📄 Live preview</h3>
        <div class="letter-preview" id="preview"></div>
      </aside>
    </div>
  `;
  if (typeof state.activePart !== "number" || state.activePart >= c.components.length) {
    const firstOpen = c.components.findIndex((x) => !isComponentAnswered(x));
    state.activePart = firstOpen === -1 ? 0 : firstOpen;
  }
  bindMissedBanner(body);
  bindLevelChooser(body, c);
  const compsEl = $("#components", body);
  compsEl.innerHTML = c.components.map((comp, idx) => {
    const para = idx > 0 ? `<label class="para-toggle"><input type="checkbox" data-parakey="${escapeHtml(comp.key)}" ${state.paragraphBreaks.has(comp.key) ? "checked" : ""}/> ¶ Start a new paragraph before this</label>` : "";
    if (lvl === 2) {
      const st = startersFor(comp);
      return `
    <div class="component" data-key="${escapeHtml(comp.key)}">
      <div class="label">${idx + 1}. ${escapeHtml(comp.label)}</div>
      <div class="starters" role="group" aria-label="Sentence starters for ${escapeHtml(comp.label)}">
        ${st.map((s, si) => `<button type="button" class="starter-chip" data-si="${si}">${escapeHtml(s)}</button>`).join("")}
      </div>
      <label class="sr-only" for="resp${idx}">${escapeHtml(comp.label)} — write your own words</label>
      <textarea id="resp${idx}" class="custom-response" data-response-key="${escapeHtml(comp.key)}" maxlength="500" placeholder="Write your own words here…">${escapeHtml(state.componentResponses[comp.key] || "")}</textarea>
      ${para}
    </div>`;
    }
    return `
    <div class="component" data-key="${escapeHtml(comp.key)}">
      <div class="label">${idx + 1}. ${escapeHtml(comp.label)}</div>
      ${(comp.options || []).map((o) => `<button type="button" class="option ${state.componentChoices[comp.key] === o.id ? "picked" : ""}" data-oid="${escapeHtml(o.id)}" aria-pressed="${state.componentChoices[comp.key] === o.id}">${escapeHtml(o.text)}</button>`).join("")}
      <label for="resp${idx}" style="margin-top:9px;font-size:12px;display:block;">Or write your own:</label>
      <textarea id="resp${idx}" class="custom-response" data-response-key="${escapeHtml(comp.key)}" maxlength="500" placeholder="Type your own response…">${escapeHtml(state.componentResponses[comp.key] || "")}</textarea>
      <p class="field-note">Typing here selects “My response” instead of the 3 options.</p>
      ${para}
    </div>`;
  }).join("");

  $$(".component", compsEl).forEach((compEl, idx) => {
    const key = compEl.dataset.key;
    const comp = c.components[idx];
    const input = $(".custom-response", compEl);
    const setResponse = (val) => {
      state.componentResponses[key] = val;
      if (val.trim()) state.componentChoices[key] = "custom";
      else if (state.componentChoices[key] === "custom") delete state.componentChoices[key];
      persistProgress(); updatePreview(c); updateDraftNav(body, c);
    };
    $$(".option", compEl).forEach((btn) => btn.addEventListener("click", () => {
      state.componentChoices[key] = btn.dataset.oid;
      state.componentResponses[key] = "";
      persistProgress();
      renderDraft(body, c);
      goToNextPart(body, c, idx);
    }));
    $$(".starter-chip", compEl).forEach((chip) => chip.addEventListener("click", () => {
      const s = startersFor(comp)[Number(chip.dataset.si)] || "";
      const cur = input.value;
      const sep = cur && !/\s$/.test(cur) ? " " : "";
      input.value = (cur + sep + s).slice(0, 500);
      setResponse(input.value);
      input.focus();
      try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) { /* ignore */ }
    }));
    input.addEventListener("input", (e) => setResponse(e.target.value));
    const cb = compEl.querySelector("[data-parakey]");
    if (cb) cb.addEventListener("change", (e) => { if (e.target.checked) state.paragraphBreaks.add(key); else state.paragraphBreaks.delete(key); persistProgress(); updatePreview(c); });
  });
  $("#toggleAll", body).addEventListener("click", () => { state.showAllParts = !state.showAllParts; renderDraft(body, c); });
  updatePreview(c); updateDraftNav(body, c);
}

/** Show only the active part (unless "show all"), refresh the rail and the Previous/Next buttons. */
function applyStepper(body, c, { focus = false, scroll = false } = {}) {
  const comps = $$("#components .component", body);
  const n = c.components.length;
  const i = Math.max(0, Math.min(n - 1, state.activePart || 0));
  state.activePart = i;
  comps.forEach((el, k) => el.classList.toggle("active", k === i));
  const rail = $("#partRail", body);
  if (rail) {
    rail.innerHTML = c.components.map((comp, k) => {
      const done = isComponentAnswered(comp);
      return `<button type="button" class="part-dot${done ? " done" : ""}" data-k="${k}" ${k === i ? 'aria-current="step"' : ""} aria-label="Part ${k + 1}: ${escapeHtml(comp.label)}${done ? ", done" : ""}">${k + 1}</button>`;
    }).join("");
    $$(".part-dot", rail).forEach((b) => b.addEventListener("click", () => { state.activePart = Number(b.dataset.k); applyStepper(body, c, { focus: true, scroll: true }); }));
  }
  const cur = $("#partCurrent", body);
  if (cur) cur.textContent = `Part ${i + 1} of ${n}: ${c.components[i].label}`;
  const nav = $("#partNav", body);
  if (nav) {
    nav.innerHTML = `<button type="button" class="btn secondary" id="partPrev" ${i === 0 ? "disabled" : ""}>← Previous part</button><button type="button" class="btn secondary" id="partNext" ${i === n - 1 ? "disabled" : ""}>Next part →</button>`;
    $("#partPrev", nav).addEventListener("click", () => { state.activePart = i - 1; applyStepper(body, c, { focus: true, scroll: true }); });
    $("#partNext", nav).addEventListener("click", () => { state.activePart = i + 1; applyStepper(body, c, { focus: true, scroll: true }); });
  }
  const el = comps[i];
  if (el && scroll && !state.showAllParts) el.scrollIntoView({ behavior: prefersReducedMotion() ? "auto" : "smooth", block: "nearest" });
  if (el && focus) { const f = $(".option", el) || $("textarea", el); if (f) { try { f.focus({ preventScroll: true }); } catch (e) { f.focus(); } } }
}

/** Level 1: after a part is answered, glide to the next unanswered part. */
function goToNextPart(body, c, fromIdx) {
  const els = $$("#components .component", body);
  let target = -1;
  for (let i = fromIdx + 1; i < c.components.length; i++) { if (!isComponentAnswered(c.components[i])) { target = i; break; } }
  if (target === -1) { for (let i = 0; i < c.components.length; i++) { if (!isComponentAnswered(c.components[i])) { target = i; break; } } }
  if (target === -1) {
    const done = els[fromIdx] && $(".option.picked", els[fromIdx]);
    if (done) done.focus();
    const cf = $(".confirm-box", body);
    if (cf) cf.scrollIntoView({ behavior: prefersReducedMotion() ? "auto" : "smooth", block: "center" });
    return;
  }
  state.activePart = target;
  applyStepper(body, c, { focus: false });
  const el = els[target];
  if (!el) return;
  el.scrollIntoView({ behavior: prefersReducedMotion() ? "auto" : "smooth", block: "start" });
  const first = $(".option", el) || $("textarea", el);
  if (first) { try { first.focus({ preventScroll: true }); } catch (e) { first.focus(); } }
}

/** Mirrors assembleLetter() on the Worker: salutation / sign-off / name (letters) and headline / byline (articles) sit on their own lines. */
function assembledSegments(c) {
  const article = isArticleCase(c);
  const segs = [];
  let prev = "";
  for (const comp of c.components) {
    const choice = state.componentChoices[comp.key];
    const opt = (comp.options || []).find((o) => o.id === choice);
    const part = choice === "custom" ? (state.componentResponses[comp.key] || "").trim() : (state.level === 1 && opt ? opt.text : "");
    if (!part) continue;
    let sep = "";
    if (segs.length) {
      if (state.paragraphBreaks.has(comp.key)) sep = "\n\n";
      else if (article
        ? (prev === "headline" || prev === "byline" || comp.key === "byline")
        : (prev === "salutation" || comp.key === "signoff" || comp.key === "name")) sep = "\n";
      else sep = " ";
    }
    segs.push({ key: comp.key, text: part, sep });
    prev = comp.key;
  }
  return segs;
}

function currentAssembledLetter(c) {
  return assembledSegments(c).map((g) => g.sep + g.text).join("");
}

/** Format-aware preview: letter paper for letters, a newspaper clipping for articles. */
function previewHtml(c) {
  const segs = assembledSegments(c);
  const article = isArticleCase(c);
  const stamp = article ? "" : `<span class="doc-stamp">${caseFormat(c) === "formal_letter" ? "Formal letter" : "Informal letter"}</span>`;
  if (!segs.length) return { cls: article ? "paper-news" : "paper-letter", html: `${stamp}<span class="placeholder">Your ${docWord(c)} will appear here as you finish each part…</span>` };
  const blocks = [];
  for (const g of segs) {
    if (!blocks.length || g.sep.includes("\n")) blocks.push({ key: g.key, text: g.text });
    else blocks[blocks.length - 1].text += " " + g.text;
  }
  const e = escapeHtml;
  if (article) {
    const head = blocks.filter((b) => b.key === "headline" || b.key === "byline");
    const rest = blocks.filter((b) => b.key !== "headline" && b.key !== "byline");
    return { cls: "paper-news", html: `<div class="np-mast">SCHOOL NEWS</div>${head.map((b) => b.key === "headline" ? `<h4 class="np-headline">${e(b.text)}</h4>` : `<div class="np-byline">${e(b.text)}</div>`).join("")}<div class="np-body">${rest.map((b) => `<p>${e(b.text)}</p>`).join("")}</div>` };
  }
  return { cls: "paper-letter", html: stamp + blocks.map((b) => `<p class="${b.key === "salutation" ? "lp-salute" : (b.key === "signoff" || b.key === "name") ? "lp-sign" : ""}">${e(b.text)}</p>`).join("") };
}

function updatePreview(c) {
  const el = $("#preview");
  if (!el) return;
  const p = previewHtml(c);
  el.className = "letter-preview " + p.cls;
  el.innerHTML = p.html;
}

function isComponentAnswered(comp) {
  return !!state.componentChoices[comp.key] && (state.componentChoices[comp.key] !== "custom" || !!(state.componentResponses[comp.key] || "").trim());
}

function updateDraftNav(body, c) {
  // Called on every keystroke in a "write your own" box, so clear the old
  // nav/confirm blocks first instead of stacking duplicates.
  $$(".nav-row, .confirm-box", body).forEach((el) => el.remove());
  const done = c.components.filter(isComponentAnswered).length;
  const total = c.components.length;
  const allChosen = done === total;
  if (typeof applyStepper === "function" && $("#partRail", body)) applyStepper(body, c);
  const prog = $("#progressSticky", body);
  if (prog) {
    prog.innerHTML = `<div class="prog-row"><div class="prog-main"><b>${done} of ${total} parts done</b><div class="bar-track" aria-hidden="true"><div class="bar-fill" style="width:${total ? Math.round(done / total * 100) : 0}%"></div></div></div>${caseFileBtnHtml()}</div>`;
  }
  const box = document.createElement("div");
  if (allChosen) {
    box.className = "confirm-box";
    box.innerHTML = `
      <p><b>All ${total} parts are done!</b> Read your ${docWord(c)} in the live preview. When you are happy with it, press <b>Confirm</b> — then you can polish the ${docWord(c)} by hand before you submit.</p>
      <button type="button" class="btn" id="confirmLetter">✅ Confirm my ${docWord(c)}</button>`;
  } else {
    box.className = "confirm-box pending";
    box.textContent = `Finish all ${total} parts to confirm your ${docWord(c)} (${done}/${total} done).`;
  }
  body.appendChild(box);
  const confirmBtn = $("#confirmLetter", box);
  if (confirmBtn) confirmBtn.addEventListener("click", () => {
    state.confirmed = true;
    state.finalLetter = currentAssembledLetter(c);
    persistProgress();
    renderDraft(body, c);
    const ta = $("#finalLetter", body);
    if (ta) ta.focus();
  });
  navRow(body, {
    nextLabel: null,
    onBack: () => { state.step = 2; persistProgress(); render(); },
  });
}

/** After Confirm (Levels 1-2): the live preview turns into an editable box. The pupil's
 * part choices stay locked in (that is what the choices score is based on);
 * the text they submit is whatever is in the box. */
function renderDraftConfirmed(body, c) {
  body.innerHTML = `
    <h2 class="step-title">✍️ Step 4 — Draft Your Report</h2>
    ${missedBannerHtml()}
    <div class="locked-note">✅ Your ${docWord(c)} is confirmed. You can now <b>edit it by hand</b> — fix spelling, smooth the wording, make it sound like you. What you see below is exactly what will be marked.</div>
    ${caseFileBarHtml()}
    ${state.level >= 2 ? caseNotesHtml(c) : ""}
    <h3 style="color:var(--navy);font-size:15px;margin:10px 0 6px;">📄 Live preview — now editable</h3>
    <label for="finalLetter" class="field-note" style="display:block;margin-bottom:6px;">Edit your ${docWord(c)} here</label>
    <textarea class="letter-edit" id="finalLetter" maxlength="4000" spellcheck="true">${escapeHtml(state.finalLetter)}</textarea>
    ${proofreadHtml()}
  `;
  bindMissedBanner(body);
  const ta = $("#finalLetter", body);
  navRow(body, {
    backLabel: "↩ Change my parts", nextLabel: "Submit Report →",
    nextDisabled: !state.finalLetter.trim(),
    onBack: () => {
      const untouched = state.finalLetter.trim() === currentAssembledLetter(c).trim();
      if (!untouched && !confirm("If you go back to change your parts, the edits you made by hand will be lost. Continue?")) return;
      state.confirmed = false; state.finalLetter = "";
      persistProgress(); renderDraft(body, c);
    },
    onNext: async () => { state.finalLetter = ta.value; persistProgress(); await doSubmit(body, c); },
  });
  ta.addEventListener("input", () => {
    state.finalLetter = ta.value; persistProgress();
    const next = $("#navNext", body); if (next) next.disabled = !ta.value.trim();
  });
}

/** Level 3: one blank page for the whole letter or article. */
function renderDraftIndependent(body, c) {
  body.innerHTML = `
    <h2 class="step-title">✍️ Step 4 — Draft Your Report</h2>
    ${missedBannerHtml()}
    ${levelChooserHtml()}
    <p class="step-instr">${draftInstr()}</p>
    ${registerLineHtml(c)}
    ${caseFileBarHtml()}
    ${caseNotesHtml(c)}
    <label for="finalLetter" class="field-note" style="display:block;margin-bottom:6px;">Write your whole ${docWord(c)} here</label>
    <textarea class="letter-edit" id="finalLetter" maxlength="4000" spellcheck="true" placeholder="${isArticleCase(c) ? "Start with your headline and byline, then write your article…" : "Start with your salutation, then write your letter…"}">${escapeHtml(state.finalLetter)}</textarea>
    <p class="word-count" id="wordCount" role="status"></p>
    ${proofreadHtml()}
  `;
  bindMissedBanner(body);
  bindLevelChooser(body, c);
  const ta = $("#finalLetter", body);
  const wc = $("#wordCount", body);
  const refresh = () => {
    const n = countWords(ta.value);
    wc.textContent = `${n} word${n === 1 ? "" : "s"} — aim for about 100–150 words — a guide, not a rule.` + (n < 8 ? " Write at least 8 words to submit." : "");
    const next = $("#navNext", body); if (next) next.disabled = n < 8;
  };
  navRow(body, {
    nextLabel: "Submit Report →",
    nextDisabled: countWords(state.finalLetter) < 8,
    onBack: () => { state.step = 2; persistProgress(); render(); },
    onNext: async () => { state.finalLetter = ta.value; persistProgress(); await doSubmit(body, c); },
  });
  ta.addEventListener("input", () => { state.finalLetter = ta.value; persistProgress(); refresh(); });
  refresh();
}

function buildSubmitPayload(c) {
  const lvl = state.level;
  const payload = {
    name: state.playerName || "Anonymous Detective",
    playerClass: state.playerClass || "",
    deviceId: state.deviceId || "",
    taskAnswers: state.taskAnswers,
    stimulusSelected: Array.from(state.stimulusSelected),
    ownContent: state.ownContent,
    level: lvl,
    hideOnBoard: lsGet("bossHideOnBoard") === "1",
  };
  if (lvl === 3) {
    payload.componentChoices = {};
    payload.componentResponses = {};
    payload.paragraphBreaks = [];
    payload.finalLetter = state.finalLetter.trim();
    payload.signOffName = "";
    return payload;
  }
  payload.componentChoices = state.componentChoices;
  payload.componentResponses = state.componentResponses;
  payload.paragraphBreaks = Array.from(state.paragraphBreaks);
  payload.finalLetter = state.confirmed ? state.finalLetter.trim() : "";
  // letters sign off with the "name" part; an article's equivalent is the "byline" part
  const nameField = isArticleCase(c) ? "byline" : "name";
  const nameKey = state.componentChoices[nameField];
  let signOff = "";
  if (nameKey === "custom") signOff = state.componentResponses[nameField] || "";
  else if (lvl === 1) {
    const nameComp = c.components.find((x) => x.key === nameField);
    const opt = nameComp && (nameComp.options || []).find((o) => o.id === nameKey);
    signOff = opt ? opt.text : "";
  }
  payload.signOffName = signOff.trim();
  return payload;
}

async function doSubmit(body, c) {
  body.innerHTML = `<p class="step-instr" role="status">Filing your report with the Agency…</p>`;
  try {
    const res = await api("/api/cases/" + c.id + "/submit", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(buildSubmitPayload(c)),
    });
    state.result = res;
    state.step = 4;
    clearProgress(c.id);
    try { saveMissed(c.id, res); } catch (e) { /* ignore */ }
    const lv = Number(res.level) || state.level;
    if (res.score >= (res.threshold ?? 85) && lv < 3) {
      state.profile = Object.assign({}, state.profile || {}, { unlockedLevel: Math.max(unlockedLevel(), lv + 1) });
    }
    fetchMeta().catch(() => {}); // refresh rank / unlocks in the background
    render();
    window.scrollTo(0, 0);
  } catch (e) {
    body.innerHTML = `<p class="step-instr">Something went wrong filing your report: ${escapeHtml(e.message)}. <button class="btn secondary" id="retry">Try again</button></p>`;
    $("#retry", body).addEventListener("click", () => renderDraft(body, c));
  }
}

// ---- Step 4: Verdict ----
/** Highlights the evidence sentences inside the pupil's letter. Matching is
 * done on the RAW text (ranges), and every segment is escaped afterwards, so
 * nothing from the server or the pupil can inject markup. Not found => skipped. */
function highlightLetterHtml(letter, evidences) {
  const text = String(letter || "");
  const ranges = [];
  (evidences || []).forEach((ev) => {
    const e = String(ev || "").trim();
    if (!e) return;
    const i = text.indexOf(e);
    if (i !== -1) ranges.push([i, i + e.length]);
  });
  ranges.sort((a, b) => a[0] - b[0]);
  const merged = [];
  ranges.forEach((r) => {
    const last = merged[merged.length - 1];
    if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
    else merged.push(r.slice());
  });
  let out = "", pos = 0;
  merged.forEach(([s, e]) => {
    out += escapeHtml(text.slice(pos, s)) + "<mark>" + escapeHtml(text.slice(s, e)) + "</mark>";
    pos = e;
  });
  out += escapeHtml(text.slice(pos));
  return out.replace(/\n/g, "<br>");
}

function fixCount() { return Number(lsGet("bossFixCount")) || 0; }

function renderVerdict(body, c) {
  const r = state.result;
  if (!r) { body.innerHTML = `<p>No result yet.</p>`; return; }
  const bd = r.breakdown || {};
  const rows = [
    ["Briefing", bd.taskIdentification],
    ["Evidence", bd.stimulusKeyInfo],
    ["Own idea", bd.ownContent],
    [`${docWord(c)[0].toUpperCase() + docWord(c).slice(1)} content & accuracy`, bd.letterChoices],
    ["Paragraphing", bd.paragraphing],
    ["Language & organisation", bd.overallQuality],
  ].filter(([, b]) => b);
  const threshold = r.threshold ?? 85;
  const passed = r.score >= threshold;
  const lvl = Number(r.level) || state.level || 1;
  const aiFailures = Array.isArray(r.aiFailures) ? r.aiFailures : [];
  const moe = r.moe && r.moe.taskFulfilment && r.moe.languageOrg ? r.moe : null;
  const ck = r.checklist || {};
  const points = Array.isArray(ck.points) ? ck.points : [];
  const own = ck.ownIdea || null;
  const fmt = Array.isArray(ck.format) ? ck.format : [];
  const langErrs = Array.isArray(ck.languageErrors) ? ck.languageErrors : [];
  const wrong = Array.isArray(ck.wrongDetails) ? ck.wrongDetails : [];
  const kept = Array.isArray(ck.keptDistractors) ? ck.keptDistractors : [];
  const flags = Array.isArray(r.flags) ? r.flags : [];
  const stars = r.stars || null;
  const fix = r.fixTask || null;
  const evidences = points.map((p) => p && p.evidence).filter(Boolean);
  const pct = (b) => (b && b.max > 0 ? Math.max(0, Math.min(100, Math.round(b.score / b.max * 100))) : 0);

  const ST = {
    found: { cls: "found", icon: "✅", text: "Found" },
    partial: { cls: "partial", icon: "🟡", text: "Partly there — check the facts" },
    missing: { cls: "missing", icon: "❌", text: "Missing" },
  };
  const OWN = {
    good: "✅ Good idea — it fits the situation.",
    partial: "🟡 Partly there — your idea needs a little more.",
    weak: "❌ Needs work — try a clearer idea of your own.",
  };
  const STAR_ROWS = [["briefing", "Briefing"], ["evidence", "Evidence"], ["hunch", "Own idea"], ["language", "Language"]];

  const canNudge = passed && lvl < 3;
  const nextLevel = lvl + 1;

  body.innerHTML = `
    <h2 class="step-title">${passed ? "🎉 Situation Handled!" : "📨 Situation Filed"}</h2>
    ${aiFailures.length ? `<div class="ai-warning" role="alert">⚠️ <b>Your teacher will check part of this score.</b> The AI marker could not check: ${aiFailures.map((f) => escapeHtml(f.label || f.part)).join(", ")}. The score below uses an estimate for ${aiFailures.length > 1 ? "those parts" : "that part"}, and your teacher may update it.</div>`
      : (r.needsTeacherReview ? `<div class="ai-warning" role="status">⏳ Your teacher will take a look at this report too.</div>` : "")}
    ${r.letterEdited ? `<div class="locked-note">✏️ Your edited ${docWord(c)} is what was marked.</div>` : ""}
    <div class="score-hero">
      ${passed ? `<div class="case-closed" aria-hidden="true">CASE CLOSED</div>` : ""}
      ${moe ? `
        <div class="of">Exam-style estimate</div>
        <div class="big" aria-label="Exam-style estimate: ${escapeHtml(moe.total)} out of ${escapeHtml(moe.max || 14)}">${escapeHtml(moe.total)}<span class="of">/${escapeHtml(moe.max || 14)}</span></div>
        <div class="gauge-row">
          ${gaugeHtml(moe.taskFulfilment.score, moe.taskFulfilment.max ?? 6, "Task Fulfilment")}
          ${gaugeHtml(moe.languageOrg.score, moe.languageOrg.max ?? 8, "Language & Organisation")}
        </div>
        <div class="est-note">This is an estimate — your teacher can adjust it.</div>
      ` : ""}
      <div class="points-meter">
        <div class="lbl" style="display:flex;justify-content:space-between;font-size:13px;color:#5b4321;margin-bottom:3px;"><span>🕵️ Detective points, ${escapeHtml(state.playerName || "")}${state.playerClass ? " (" + escapeHtml(state.playerClass) + ")" : ""}</span><span><b>${escapeHtml(r.score)}/${escapeHtml(r.max)}</b></span></div>
        <div class="bar-track" role="img" aria-label="Detective points: ${escapeHtml(r.score)} out of ${escapeHtml(r.max)}. Mastery needs ${escapeHtml(threshold)}."><div class="bar-fill" style="width:${Math.max(0, Math.min(100, Math.round(r.score / (r.max || 100) * 100)))}%"></div></div>
        <div class="field-note">Mastery threshold: ${escapeHtml(threshold)}/${escapeHtml(r.max)} — ${passed ? "you reached it! ✔" : "not reached yet"}</div>
      </div>
    </div>

    ${stars ? `
      <ul class="stars-row" aria-label="Your stars">
        ${STAR_ROWS.map(([k, label]) => `<li class="${stars[k] ? "on" : ""}">${stars[k] ? "⭐" : "☆"} ${label}: ${stars[k] ? "star earned" : "no star yet"}</li>`).join("")}
      </ul>` : ""}

    ${points.length ? `
      <div class="v-section">
        <h3>🔎 Did you include every required detail?</h3>
        <ul class="check-list">
          ${points.map((p) => { const s = ST[p.status] || ST.missing; return `<li class="${s.cls}"><span class="st">${s.icon} ${s.text}</span>${escapeHtml(p.text)}</li>`; }).join("")}
        </ul>
      </div>` : ""}

    ${own ? `
      <div class="v-section">
        <h3>💡 Your own idea</h3>
        <div class="prompt-box" style="margin:0;">${escapeHtml(OWN[own.status] || OWN.weak)}${own.inLetter === false ? " It is not in your letter yet." : ""}${own.linkedToClue === false ? " Try linking it to a clue from the notice." : ""}${own.note ? `<br>${escapeHtml(own.note)}` : ""}</div>
      </div>` : ""}

    ${fmt.length ? `
      <div class="v-section">
        <h3>📋 ${docWord(c)[0].toUpperCase() + docWord(c).slice(1)} format</h3>
        <ul class="check-list">
          ${fmt.map((f) => `<li class="${f.ok ? "found" : "missing"}"><span class="st">${f.ok ? "✔ Good" : "✖ Check this"}</span><b>${escapeHtml(f.label)}</b>${f.detail ? ` — ${escapeHtml(f.detail)}` : ""}</li>`).join("")}
        </ul>
      </div>` : ""}

    ${(langErrs.length || wrong.length || kept.length || flags.length) ? `
      <div class="v-section">
        <h3>👀 Things to look at</h3>
        <ul class="look-list">
          ${langErrs.map((t) => `<li>${escapeHtml(t)}</li>`).join("")}
          ${wrong.map((t) => `<li>Check this number against the notice: ${escapeHtml(t)}</li>`).join("")}
          ${kept.map((k) => `<li>You kept this sentence that does not fit: ${escapeHtml(k.text || k.label)}</li>`).join("")}
          ${flags.map((f) => `<li>${escapeHtml(f.label)}</li>`).join("")}
        </ul>
      </div>` : ""}

    <div class="v-section">
      <h3>${isArticleCase(c) ? "📰 Your article" : "✉️ Your letter"}</h3>
      ${evidences.length ? `<p class="field-note" style="margin:0 0 6px;">The <mark>highlighted</mark> sentences show where you used the required details.</p>` : ""}
      <div class="letter-preview">${highlightLetterHtml(r.assembledLetter, evidences)}</div>
    </div>

    <div class="v-section">
      <h3>🕵️ Detective points breakdown</h3>
      ${rows.map(([label, b]) => `
        <div class="bar-row">
          <div class="lbl"><span>${escapeHtml(label)}</span><span>${escapeHtml(b.score)}/${escapeHtml(b.max)}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct(b)}%"></div></div>
          ${b.aiNote ? `<div class="ai-note">🤖 ${escapeHtml(b.aiNote)}</div>` : ""}
          ${b.aiFailed ? `<div class="ai-flag">⚠️ Estimated score — waiting for your teacher to check.</div>` : ""}
        </div>
      `).join("")}
    </div>

    ${fix ? `
      <div class="fix-card" id="fixCard">
        <h3>🔧 Fix this one thing</h3>
        <p><b>${escapeHtml(fix.title)}</b></p>
        <p>${escapeHtml(fix.prompt)}</p>
        <label for="fixText" class="sr-only">Your fix</label>
        <textarea id="fixText" maxlength="1000" placeholder="Type your fix here…" style="min-height:${fix.kind === "pair" ? 80 : 90}px;">${fix.kind === "pair" && fix.salutation ? escapeHtml(fix.salutation + "\n") : ""}</textarea>
        <div style="margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <button type="button" class="btn" id="fixCheck">Check my fix</button>
          <span class="fix-msg" id="fixMsg" role="status" aria-live="polite"></span>
        </div>
      </div>` : ""}

    ${r.improvement ? `
      <div class="improve-box">
        <h3 style="color:var(--navy);font-size:15px;margin:0 0 6px;">🚀 Your boss's coach rewrote a stronger version</h3>
        <p class="step-instr" style="margin-bottom:10px;">You scored below the ${escapeHtml(threshold)}-point mastery threshold, so here's what a stronger reply could look like — study what changed before your next case.</p>
        <div class="letter-preview" style="margin-bottom:10px;">${escapeHtml(r.improvement.improvedLetter).replace(/\n/g, "<br>")}</div>
        ${r.improvement.tips && r.improvement.tips.length ? `
          <ul class="tips-list">${r.improvement.tips.map((t) => `<li>${escapeHtml(t)}</li>`).join("")}</ul>
        ` : ""}
      </div>
    ` : ""}

    <details class="model-d">
      <summary>One good example (other accurate wordings are fine too)</summary>
      <div class="model-compare" style="margin-top:10px;">${escapeHtml(r.modelLetter)}</div>
    </details>

    ${canNudge ? `
      <div class="nudge">
        <span>🚀 <b>Ready for Level ${nextLevel}?</b> You mastered this case — try it again with less help.</span>
        <button type="button" class="btn" id="nudgeGo">Try Level ${nextLevel} →</button>
      </div>` : ""}

    <div class="verdict-actions">
      <button type="button" class="btn primary" id="vRetry">🔁 Try this case again</button>
      <button type="button" class="btn secondary" id="vCases">← Case Files</button>
      <button type="button" class="btn" id="vBoard">🏆 View Leaderboard</button>
    </div>
  `;

  animateGauges(body);
  $("#vRetry", body).addEventListener("click", () => openCase(c.id));
  $("#vCases", body).addEventListener("click", () => { state.screen = "home"; loadHome(); });
  $("#vBoard", body).addEventListener("click", () => openLeaderboard());
  const nudge = $("#nudgeGo", body);
  if (nudge) nudge.addEventListener("click", () => openCase(c.id, { level: nextLevel }));

  if (fix) {
    const btn = $("#fixCheck", body);
    const msg = $("#fixMsg", body);
    let counted = false;
    btn.addEventListener("click", async () => {
      const text = $("#fixText", body).value;
      btn.disabled = true;
      msg.className = "fix-msg";
      msg.textContent = "Checking…";
      try {
        const res = await api("/api/cases/" + c.id + "/fix-check", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ task: { kind: fix.kind, pointId: fix.pointId }, text }),
        });
        if (res.ok) {
          msg.className = "fix-msg ok";
          msg.textContent = "⭐ Fixed! " + (res.message || "");
          if (!counted) { counted = true; lsSet("bossFixCount", String(fixCount() + 1)); }
        } else {
          msg.textContent = res.message || "Not quite yet — have another go.";
        }
      } catch (e) {
        msg.textContent = "Couldn't check that right now: " + e.message;
      }
      btn.disabled = false;
    });
  }
}

// ---- overlays (leaderboard, my scores) ----
function showOverlay(label, innerHtml) {
  const prev = document.activeElement;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="board" role="dialog" aria-modal="true" aria-label="${escapeHtml(label)}">
      <button type="button" class="board-close" aria-label="Close">✕</button>
      ${innerHtml}
    </div>`;
  document.body.appendChild(overlay);
  const close = () => {
    overlay.remove();
    document.removeEventListener("keydown", onKey);
    if (prev && prev.focus) { try { prev.focus(); } catch (e) { /* ignore */ } }
  };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  $(".board-close", overlay).addEventListener("click", close);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  $(".board-close", overlay).focus();
  return overlay;
}

// ---- leaderboard ----
async function openLeaderboard() {
  const hasClass = !!state.playerClass;
  let tab = hasClass ? "class" : "school";
  const overlay = showOverlay("Wall of Fame", `
    <h2>🏆 Wall of Fame</h2>
    <div class="lb-tabs" role="tablist" aria-label="Which wall">
      ${hasClass ? `<button type="button" class="lb-tab" role="tab" id="tabClass" data-tab="class">My class</button>` : ""}
      <button type="button" class="lb-tab" role="tab" id="tabSchool" data-tab="school">School</button>
    </div>
    <label class="lb-hide"><input type="checkbox" id="hideMe" ${lsGet("bossHideOnBoard") === "1" ? "checked" : ""}/> Hide my name from the Wall</label>
    <div id="lbList" role="tabpanel" aria-live="polite">Loading…</div>
  `);
  $("#hideMe", overlay).addEventListener("change", (e) => { lsSet("bossHideOnBoard", e.target.checked ? "1" : "0"); });
  const load = async () => {
    $$(".lb-tab", overlay).forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
    const listEl = $("#lbList", overlay);
    listEl.textContent = "Loading…";
    try {
      const path = tab === "class" ? "/api/leaderboard?class=" + encodeURIComponent(state.playerClass) : "/api/leaderboard";
      const data = await api(path);
      if (!document.body.contains(overlay)) return;
      const list = data.leaderboard || [];
      listEl.innerHTML = list.length ? list.map((row, i) => `
        <div class="lb-row">
          <div><span class="lb-rank">#${i+1}</span><span class="lb-name">${escapeHtml(row.player_name)}</span>${tab === "school" && row.player_class ? ` <span class="lb-case" style="display:inline;">(${escapeHtml(row.player_class)})</span>` : ""}<span class="lb-case">${escapeHtml(row.case_title)}</span></div>
          <div class="lb-score">${escapeHtml(row.score)}/${escapeHtml(row.max_score)}</div>
        </div>
      `).join("") : `<p style="color:#f4e8c8">No cases solved yet — be the first!</p>`;
    } catch (e) {
      listEl.innerHTML = `<p style="color:#f4e8c8">Couldn't load the leaderboard right now.</p>`;
    }
  };
  $$(".lb-tab", overlay).forEach((b) => b.addEventListener("click", () => { tab = b.dataset.tab; load(); }));
  load();
}

// ---- my scores ----
async function openMyScores() {
  const overlay = showOverlay("My Scores", `
    <h2>📈 My Scores</h2>
    <div id="myScoresList" aria-live="polite">Loading…</div>
  `);
  if (!state.playerName) {
    $("#myScoresList", overlay).innerHTML = `<p style="color:#f4e8c8">Identify yourself first to see your scores.</p>`;
    return;
  }
  try {
    const data = await api("/api/my-scores" + identityQs());
    if (data && data.profile) state.profile = data.profile;
    if (!document.body.contains(overlay)) return;
    const list = data.scores || [];
    $("#myScoresList", overlay).innerHTML = list.length ? list.map((row) => {
      const d = row.delta;
      const deltaTxt = (typeof d === "number" && Number.isFinite(d))
        ? (d > 0 ? `Up +${d} since your last try` : d < 0 ? `Down −${Math.abs(d)} since your last try` : `Same as your last try (±0)`)
        : "";
      const moe = row.moe && row.moe.taskFulfilment && row.moe.languageOrg ? row.moe : null;
      const lv = Number(row.level);
      return `
      <div class="lb-row">
        <div><span class="lb-case">${escapeHtml(row.case_title)}</span>
          ${lv >= 1 ? `<span class="lb-sub light">Level ${lv} — ${escapeHtml((LEVELS[lv - 1] || {}).name || "")}</span>` : ""}
          ${moe ? `<span class="lb-sub light">Exam-style estimate: TF ${escapeHtml(moe.taskFulfilment.score ?? moe.taskFulfilment)}/6 · L&amp;O ${escapeHtml(moe.languageOrg.score ?? moe.languageOrg)}/8</span>` : ""}
          ${row.personalBest ? `<span class="lb-sub">🏅 Personal best!</span>` : ""}
          ${deltaTxt ? `<span class="lb-sub light">${d > 0 ? "▲" : d < 0 ? "▼" : "＝"} ${escapeHtml(deltaTxt)}</span>` : ""}
          ${row.pendingReview ? `<span class="lb-sub">⏳ Your teacher is checking part of this score</span>` : ""}
          ${row.teacherComment ? `<span class="lb-sub" style="color:#2f5a22;">🧑‍🏫 Teacher's note: ${escapeHtml(row.teacherComment)}</span>` : ""}
        </div>
        <div class="lb-score">${escapeHtml(row.score)}/${escapeHtml(row.max_score)}</div>
      </div>`;
    }).join("") : `<p style="color:#f4e8c8">No cases solved yet — go crack one!</p>`;
  } catch (e) {
    $("#myScoresList", overlay).innerHTML = `<p style="color:#f4e8c8">Couldn't load your scores right now.</p>`;
  }
}

function escapeHtml(s) {
  return (s ?? "").toString().replace(/[&<>"']/g, (m) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}

$("#btnLeaderboard").addEventListener("click", openLeaderboard);
$("#btnMyScores").addEventListener("click", openMyScores);

if (state.playerName) { loadHome(); } else { render(); }
</script>
</body>
